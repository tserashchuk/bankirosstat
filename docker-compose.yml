services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  app:
    build: .
    image: project-hub:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/project_hub.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    image: project-hub:latest
    restart: unless-stopped
    command: ["arq", "app.services.jobs.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/project_hub.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  app-data:
